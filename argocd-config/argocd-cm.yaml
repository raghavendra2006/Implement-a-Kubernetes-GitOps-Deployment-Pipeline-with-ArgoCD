apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # -------------------------------------------------------
  # Custom Health Checks
  # -------------------------------------------------------

  # Health check for cert-manager.io Certificate CRD
  resource.customizations.health.cert-manager.io_Certificate: |
    hs = {}
    if obj.status ~= nil then
      if obj.status.conditions ~= nil then
        for i, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message or "Certificate is ready"
              return hs
            end
          end
        end
      end
    end
    hs.status = "Progressing"
    hs.message = "Waiting for certificate to become ready"
    return hs

  # Health check for batch/Job
  resource.customizations.health.batch_Job: |
    hs = {}
    if obj.status ~= nil then
      if obj.status.succeeded ~= nil and obj.status.succeeded > 0 then
        hs.status = "Healthy"
        hs.message = "Job completed successfully"
        return hs
      end
      if obj.status.failed ~= nil and obj.status.failed > 0 then
        hs.status = "Degraded"
        hs.message = "Job has failed"
        return hs
      end
    end
    hs.status = "Progressing"
    hs.message = "Job is still running"
    return hs

  # -------------------------------------------------------
  # Resource Customizations — Ignore Differences
  # -------------------------------------------------------
  resource.customizations.ignoreDifferences.all: |
    jsonPointers:
      - /metadata/managedFields
    jqPathExpressions:
      - .status
