replicaCount: 1
image:
  repository: nginx
  tag: "1.25-alpine"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
containerPort: 80
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
probes:
  readiness:
    enabled: true
    path: /
    port: 80
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    enabled: true
    path: /
    port: 80
    initialDelaySeconds: 10
    periodSeconds: 15
configMap:
  enabled: true
  indexHtml: |
    <!DOCTYPE html>
    <html><body><h1>Frontend v1.0.0 - Default</h1></body></html>
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilization: 80
nodeSelector: {}
tolerations: []
