apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-notifications-cm
    app.kubernetes.io/part-of: argocd
data:
  # -------------------------------------------------------
  # Webhook Service
  # -------------------------------------------------------
  service.webhook.generic-webhook: |
    url: https://webhook.site/YOUR-UNIQUE-URL
    headers:
      - name: Content-Type
        value: application/json

  # -------------------------------------------------------
  # Templates
  # -------------------------------------------------------
  template.app-sync-succeeded: |
    webhook:
      generic-webhook:
        method: POST
        body: |
          {
            "event": "sync-succeeded",
            "app": "{{.app.metadata.name}}",
            "syncStatus": "{{.app.status.sync.status}}",
            "healthStatus": "{{.app.status.health.status}}",
            "timestamp": "{{.app.status.operationState.finishedAt}}",
            "message": "Application {{.app.metadata.name}} has been successfully synced."
          }

  template.app-sync-failed: |
    webhook:
      generic-webhook:
        method: POST
        body: |
          {
            "event": "sync-failed",
            "app": "{{.app.metadata.name}}",
            "syncStatus": "{{.app.status.sync.status}}",
            "error": "{{.app.status.operationState.message}}",
            "timestamp": "{{.app.status.operationState.finishedAt}}",
            "message": "Application {{.app.metadata.name}} sync has failed."
          }

  template.app-health-degraded: |
    webhook:
      generic-webhook:
        method: POST
        body: |
          {
            "event": "health-degraded",
            "app": "{{.app.metadata.name}}",
            "healthStatus": "{{.app.status.health.status}}",
            "syncStatus": "{{.app.status.sync.status}}",
            "timestamp": "{{(call .time.Now).UTC.Format \"2006-01-02T15:04:05Z\"}}",
            "message": "Application {{.app.metadata.name}} health has degraded."
          }

  # -------------------------------------------------------
  # Triggers
  # -------------------------------------------------------
  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase == 'Succeeded'
      send:
        - app-sync-succeeded

  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send:
        - app-sync-failed

  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send:
        - app-health-degraded

  # -------------------------------------------------------
  # Default Subscriptions — all apps get these triggers
  # -------------------------------------------------------
  subscriptions: |
    - recipients:
        - generic-webhook
      triggers:
        - on-sync-succeeded
        - on-sync-failed
        - on-health-degraded
