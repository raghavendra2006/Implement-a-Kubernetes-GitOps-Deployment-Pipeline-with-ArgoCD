replicaCount: 3
image:
  repository: nginx
  tag: "1.25-alpine"
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilization: 70
configMap:
  enabled: true
  indexHtml: |
    <!DOCTYPE html>
    <html>
    <head><title>Frontend - PRODUCTION</title></head>
    <body>
      <h1>🚀 Frontend Application</h1>
      <p>Environment: <strong>Production</strong></p>
      <p>Version: 1.0.0</p>
    </body>
    </html>
