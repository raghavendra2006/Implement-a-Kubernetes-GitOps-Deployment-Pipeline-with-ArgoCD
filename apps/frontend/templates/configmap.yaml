{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}-html
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  index.html: |
    {{- .Values.configMap.indexHtml | nindent 4 }}
{{- end }}
