apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "backend.fullname" . }}-db-migration
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        app: db-migration
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "=== Database Migration Started ==="
              echo "Running schema migrations..."
              sleep 5
              echo "Migration step 1/3: Creating tables... done"
              sleep 3
              echo "Migration step 2/3: Adding indexes... done"
              sleep 2
              echo "Migration step 3/3: Seeding data... done"
              echo "=== Database Migration Completed Successfully ==="
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
  backoffLimit: 3
